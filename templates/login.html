<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AgriVision AI</title>
    <link rel="icon" href="../static/images/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../static/css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top" data-bs-theme="dark">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="/">
          <img
            src="../static/images/logo.svg"
            alt="Logo"
            width="30"
            height="30"
          />
          <span class="fw-bold">AgriVision AI</span>
        </a>
        <div class="collapse navbar-collapse justify-content-end">
          <ul class="navbar-nav align-items-center gap-3">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item">
              <a class="nav-link" href="/about">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/login">Login</a>
            </li>
            <li class="nav-item">
              <a
                class="btn btn-success btn-sm px-3 text-dark fw-bold"
                href="/signup"
                >Sign Up</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="hero-section">
      <div
        class="hero-overlay d-flex align-items-center justify-content-center"
      >
        <div class="form-box glass-panel">
          <h3 class="fw-bold mb-1 text-white">Welcome Back</h3>
          <p class="hero-subtitle mb-4">
            Log in to analyze vegetable plant diseases
          </p>
          {% if error %}
          <div
            class="alert alert-danger py-2 px-3 mb-3 text-start small border-0 bg-danger bg-opacity-25 text-white rounded-3"
            role="alert"
          >
            {{ error }}
          </div>
          {% endif %}
          <form action="/login" method="POST">
            <div class="mb-3 text-start">
              <label class="form-label custom-form-label">Email Address</label>
              <input
                type="email"
                class="form-control custom-form-control"
                name="email"
                required
                placeholder="name@example.com"
              />
            </div>
            <div class="mb-4 text-start">
              <label class="form-label custom-form-label">Password</label>
              <input
                type="password"
                class="form-control custom-form-control"
                name="password"
                required
                placeholder="••••••••"
              />
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">
              Login
            </button>
          </form>

          <p class="mt-4 small auth-footer-text mb-0">
            Don't have an account?
            <a
              href="/signup"
              class="text-accent text-decoration-none fw-bold ms-1"
              >Sign up</a
            >
          </p>
        </div>
      </div>
    </main>
    <script src="../static/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
